<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Event Timers</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="banner" role="alert" hidden>
      <span class="bannerText"></span>
      <button type="button" class="mute">Mute</button>
      <button type="button" class="dismiss" aria-label="Dismiss">×</button>
    </div>
    <div class="controls">
      <div class="status"></div>
      <div class="resets"></div>
      <div class="chips tabs" role="tablist">
        <button type="button" class="tab" data-tab="events" role="tab">Events</button>
        <button type="button" class="tab" data-tab="bosses" role="tab">Bosses</button>
        <button type="button" class="tab" data-tab="alerts" role="tab">Alerts</button>
        <button type="button" class="tab" data-tab="settings" role="tab">Settings</button>
      </div>
    </div>
    <section class="view events">
      <ol class="list eventList"></ol>
      <div class="hidden"></div>
    </section>
    <section class="view bosses" hidden>
      <h2 class="group scheduledHead">Scheduled bosses</h2>
      <ol class="list scheduledList"></ol>
      <h2 class="group fieldHead">Field bosses</h2>
      <p class="note fieldNote"></p>
      <ol class="list fieldList"></ol>
    </section>
    <section class="view alerts" hidden>
      <button type="button" class="btn alertOptionsBtn">Config</button>
      <ol class="alertList"></ol>
    </section>
    <section class="view settings" hidden>
      <div class="alertSettings">
        <h2 class="group alertDefaults"><span class="defaultsHead"></span></h2>
        <label class="setting"><span class="soundLabel">Sound</span> <select class="sound"></select></label>
        <label class="setting"><span class="repeatLabel">Repeat</span> <select class="repeat"></select></label>
        <label class="setting"><span class="colorLabel">Alert colour</span> <select class="colorSelect"></select></label>
        <label class="setting"><span class="defaultLeadLabel">Alert time</span> <select class="defaultLead"></select></label>
        <label class="setting"><span class="defaultClosedLabel">Alert time while AION2 is closed</span> <select class="defaultClosed"></select></label>
        <p class="note defaultsNote"></p>
        <button type="button" class="btn applyAll">Apply to current alerts</button>
        <label class="option popRow"><input type="checkbox" class="pop" /> <span class="popLabel">Only show this window when an alert goes off</span></label>
        <p class="note popNote" hidden>The window stays hidden until an alert goes off. To see it before then: Settings → Plugins → Open.</p>
        <button type="button" class="btn testAlert">Test Alert</button>
      </div>
      <label class="setting"><span class="regionLabel">Region</span> <select class="regionSelect"></select></label>
      <label class="setting"><span class="zoneLabel">Show times in</span> <select class="zoneSelect"></select></label>
      <label class="setting"><span class="scaleLabel">Text size</span> <select class="scaleSelect"></select></label>
    </section>
    <div class="modal" role="dialog" aria-modal="true" hidden>
      <div class="modalBox">
        <p class="modalText"></p>
        <div class="modalButtons">
          <button type="button" class="modalNo">Cancel</button>
          <button type="button" class="modalYes">Apply</button>
        </div>
      </div>
    </div>
    <script src="/_sdk/a2.js"></script>
    <script src="schedule.js"></script>
    <script src="sounds.js"></script>
    <script src="plugin.js"></script>
  </body>
</html>
