<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Event Timers</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="controls">
      <div class="tabs" role="tablist">
        <button type="button" class="tab" data-tab="timers" role="tab">Timers</button>
        <button type="button" class="tab" data-tab="alerts" role="tab">Alerts</button>
        <button type="button" class="tab" data-tab="settings" role="tab">Settings</button>
      </div>
      <div class="status"></div>
    </div>
    <section class="view timers">
      <ol class="events"></ol>
      <div class="hidden"></div>
    </section>
    <section class="view alerts" hidden>
      <div class="alertOptions">
        <label class="soundRow"><span class="soundLabel">Sound</span> <select class="sound"></select></label>
        <button type="button" class="testSound">Play</button>
        <label class="popRow"><input type="checkbox" class="pop" /> <span class="popLabel">Show this window when an alert goes off</span></label>
      </div>
      <ol class="alertList"></ol>
    </section>
    <section class="view settings" hidden>
      <label class="setting"><span class="regionLabel">Server</span> <select class="regionSelect"></select></label>
      <label class="setting"><span class="zoneLabel">Show times in</span> <select class="zoneSelect"></select></label>
    </section>
    <script src="/_sdk/a2.js"></script>
    <script src="schedule.js"></script>
    <script src="sounds.js"></script>
    <script src="plugin.js"></script>
  </body>
</html>
